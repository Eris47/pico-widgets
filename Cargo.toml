[package]
name = "pico-widgets"
version = "0.4.0"
edition = "2021"
description = "A tiny, low-memory desktop widgets app for Windows"
license = "MIT"
readme = "README.md"

[dependencies]
# Software drawing: rounded shapes, anti-aliasing, shadows, image fills. No GPU needed.
tiny-skia = "0.11"
# Turns font outlines into pixels (text).
fontdue = "0.9"
# Reads and writes the settings file.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
keyring = { version = "3", features = ["windows-native"] }
rand = "0.8"
sha2 = "0.10"
ureq = { version = "2.12", features = ["json"] }
# Image loading. Only the formats we need, to keep the exe small.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
# Thin, zero-overhead bindings to the Windows API.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# These settings make the final .exe small and fast.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
