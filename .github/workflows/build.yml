name: Build

# When does this run?
#  - every push to the main branch
#  - every pull request
#  - when you push a version tag like v0.1.0 (this also publishes a Release)
#  - when you click "Run workflow" in the Actions tab
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach files to a Release

jobs:
  build:
    # GitHub lends us a fresh Windows machine for a few minutes
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Cache downloaded libraries (faster builds)
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Zip the exe
        shell: pwsh
        run: Compress-Archive -Path target/release/pico-widgets.exe -DestinationPath pico-widgets-windows.zip

      - name: Keep the zip as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: pico-widgets-windows
          path: pico-widgets-windows.zip

      - name: Publish a Release (only for version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: pico-widgets-windows.zip
